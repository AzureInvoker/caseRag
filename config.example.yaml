# ──────────────────────────────────────────
# 测试用例知识库 — 配置文件
# 复制为 config.yaml 并修改
# ──────────────────────────────────────────

# API 服务
api:
  host: "0.0.0.0"
  port: 8765

# 向量引擎
engine:
  # 嵌入模型，可选：
  #   all-MiniLM-L6-v2    (22MB, 最快，英文为主)
  #   paraphrase-multilingual-MiniLM-L12-v2 (112MB, 支持中文)
  embed_model: "all-MiniLM-L6-v2"
  # ChromaDB 持久化目录（相对于项目根目录）
  chroma_dir: ".chroma_db"
