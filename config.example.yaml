# ──────────────────────────────────────────
# 测试用例知识库 — 配置文件
# 复制为 config.yaml 并修改
# ──────────────────────────────────────────

# API 服务
api:
  host: "0.0.0.0"
  port: 8765

# 向量引擎
engine:
  # 嵌入模型，可选：
  #   BAAI/bge-small-zh-v1.5    (33MB, ⭐推荐，原生中文)
  #   all-MiniLM-L6-v2          (22MB, 纯英文，中文不适用)
  embed_model: "BAAI/bge-small-zh-v1.5"
  # ChromaDB 持久化目录（相对于项目根目录）
  chroma_dir: ".chroma_db"
